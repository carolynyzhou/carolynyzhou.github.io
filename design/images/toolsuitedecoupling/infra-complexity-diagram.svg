<svg viewBox="0 0 1320 930" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1320" height="930" fill="#ffffff"/>

  <!-- ===== header icons ===== -->
  <rect x="45" y="15" width="265" height="255" rx="46" fill="#FF9F0A"/>
  <g transform="translate(177,142) rotate(-20)" fill="#ffffff">
    <path d="M-70,-45 H10 L65,0 L10,45 H-70 Q-85,45 -85,30 V-30 Q-85,-45 -70,-45 Z"/>
    <circle cx="-48" cy="0" r="11" fill="#FF9F0A"/>
  </g>

  <rect x="850" y="15" width="265" height="255" rx="46" fill="#AEAEB2"/>
  <g transform="translate(982,150)" fill="#ffffff">
    <circle cx="58" cy="-60" r="24"/>
    <path d="M16,58 Q16,0 58,0 Q100,0 100,58 Z"/>
    <circle cx="-10" cy="-48" r="33"/>
    <path d="M-58,64 Q-58,-8 -10,-8 Q38,-8 38,64 Z"/>
  </g>

  <!-- ===== center dotted spine ===== -->
  <line x1="608" y1="15" x2="608" y2="800" stroke="#3EA6E8" stroke-width="4" stroke-dasharray="1,11"/>

  <!-- ===== row 1: configure audits (boxed) ===== -->
  <rect x="30" y="325" width="310" height="115" rx="16" fill="none" stroke="#F5A100" stroke-width="3" stroke-dasharray="7,7"/>
  <rect x="845" y="325" width="290" height="115" rx="16" fill="none" stroke="#8E8E93" stroke-width="3" stroke-dasharray="7,7"/>

  <g transform="translate(58,362)" fill="none" stroke="#F5A100" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="30" height="22" rx="4"/>
    <path d="M6,11 L12,17 L24,5"/>
  </g>
  <text x="110" y="378" font-size="30" font-weight="600" fill="#F5A100">Eval team</text>
  <text x="110" y="413" font-size="30" font-weight="600" fill="#F5A100">configures audits</text>

  <g transform="translate(880,362)" fill="none" stroke="#8E8E93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="30" height="22" rx="4"/>
    <path d="M6,11 L12,17 L24,5"/>
  </g>
  <text x="930" y="378" font-size="30" font-weight="600" fill="#6D6D72">Eval team</text>
  <text x="930" y="413" font-size="30" font-weight="600" fill="#6D6D72">configures audits</text>

  <!-- arrow row1 -> row2 -->
  <line x1="185" y1="440" x2="185" y2="500" stroke="#F5A100" stroke-width="4" stroke-dasharray="1,9" marker-end="url(#arrowOrange)"/>
  <line x1="995" y1="440" x2="995" y2="500" stroke="#8E8E93" stroke-width="4" stroke-dasharray="1,9" marker-end="url(#arrowGray)"/>

  <!-- ===== row 2: complete audits / sees performance (no box) ===== -->
  <circle cx="42" cy="536" r="20" fill="#F5A100"/>
  <text x="80" y="542" font-size="27" font-weight="600" fill="#F5A100">Raters complete audits</text>
  <text x="80" y="577" font-size="27" font-weight="600" fill="#F5A100">in their task queue</text>

  <g transform="translate(855,520)" fill="none" stroke="#8E8E93" stroke-width="3" stroke-linecap="round">
    <rect x="0" y="0" width="32" height="24" rx="4"/>
    <circle cx="9" cy="12" r="4.5" fill="#8E8E93" stroke="none"/>
    <line x1="17" y1="7" x2="27" y2="7"/>
    <line x1="17" y1="12" x2="27" y2="12"/>
    <line x1="17" y1="17" x2="23" y2="17"/>
  </g>
  <text x="910" y="542" font-size="27" font-weight="600" fill="#6D6D72">Eval team sees</text>
  <text x="910" y="577" font-size="27" font-weight="600" fill="#6D6D72">rater performance</text>

  <!-- horizontal connector row2 (pointing right) -->
  <line x1="400" y1="548" x2="560" y2="548" stroke="#C7C7CC" stroke-width="4"/>
  <line x1="656" y1="548" x2="796" y2="548" stroke="#C7C7CC" stroke-width="4" marker-end="url(#arrowChainRight)"/>
  <g fill="none" stroke="#3EA6E8" stroke-width="6">
    <circle cx="598" cy="548" r="16"/>
    <circle cx="618" cy="548" r="16"/>
  </g>

  <!-- arrow row2 -> row3 -->
  <line x1="185" y1="580" x2="185" y2="678" stroke="#F5A100" stroke-width="4" stroke-dasharray="1,9" marker-end="url(#arrowOrange)"/>
  <line x1="995" y1="580" x2="995" y2="678" stroke="#8E8E93" stroke-width="4" stroke-dasharray="1,9" marker-end="url(#arrowGray)"/>

  <!-- ===== row 3: see tasks in annotation site / tasks per rater (no box) ===== -->
  <g transform="translate(24,700)" stroke="#F5A100" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="3" cy="0" r="2.5" fill="#F5A100" stroke="none"/>
    <line x1="12" y1="0" x2="30" y2="0"/>
    <circle cx="3" cy="9" r="2.5" fill="#F5A100" stroke="none"/>
    <line x1="12" y1="9" x2="30" y2="9"/>
    <circle cx="3" cy="18" r="2.5" fill="#F5A100" stroke="none"/>
    <line x1="12" y1="18" x2="30" y2="18"/>
  </g>
  <text x="65" y="712" font-size="27" font-weight="600" fill="#F5A100">Raters &amp; Eval team see</text>
  <text x="30" y="747" font-size="27" font-weight="600" fill="#F5A100">tasks in the Annotation site</text>

  <g transform="translate(855,696)" fill="none" stroke="#8E8E93" stroke-width="3" stroke-linecap="round">
    <rect x="4" y="0" width="32" height="22" rx="3"/>
    <line x1="20" y1="22" x2="20" y2="28"/>
    <line x1="10" y1="28" x2="30" y2="28"/>
  </g>
  <text x="910" y="712" font-size="27" font-weight="600" fill="#6D6D72">Eval team sees</text>
  <text x="910" y="747" font-size="27" font-weight="600" fill="#6D6D72">Annotation tasks per rater</text>

  <!-- horizontal connector row3 (pointing left) -->
  <line x1="796" y1="723" x2="656" y2="723" stroke="#C7C7CC" stroke-width="4"/>
  <line x1="560" y1="723" x2="400" y2="723" stroke="#C7C7CC" stroke-width="4" marker-end="url(#arrowChainLeft)"/>
  <g fill="none" stroke="#3EA6E8" stroke-width="6">
    <circle cx="598" cy="723" r="16"/>
    <circle cx="618" cy="723" r="16"/>
  </g>

  <!-- arrow row3 -> row4 -->
  <line x1="185" y1="750" x2="185" y2="795" stroke="#F5A100" stroke-width="4" stroke-dasharray="1,9" marker-end="url(#arrowOrange)"/>
  <line x1="995" y1="750" x2="995" y2="795" stroke="#8E8E93" stroke-width="4" stroke-dasharray="1,9" marker-end="url(#arrowGray)"/>

  <!-- ===== row 4: see judgment (boxed) ===== -->
  <rect x="30" y="800" width="310" height="105" rx="16" fill="none" stroke="#F5A100" stroke-width="3" stroke-dasharray="7,7"/>
  <rect x="845" y="800" width="290" height="105" rx="16" fill="none" stroke="#8E8E93" stroke-width="3" stroke-dasharray="7,7"/>

  <g transform="translate(60,838)" fill="none" stroke="#F5A100" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="26" rx="6"/>
    <path d="M12,26 L12,36 L22,26"/>
  </g>
  <text x="122" y="862" font-size="34" font-weight="700" fill="#F5A100">See judgment</text>

  <g transform="translate(880,838)" fill="none" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="26" rx="6"/>
    <path d="M12,26 L12,36 L22,26"/>
  </g>
  <text x="942" y="862" font-size="34" font-weight="700" fill="#6D6D72">See judgment</text>

  <defs>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#F5A100"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8E8E93"/>
    </marker>
    <marker id="arrowChainRight" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C7C7CC"/>
    </marker>
    <marker id="arrowChainLeft" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C7C7CC"/>
    </marker>
  </defs>
</svg>
