<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="700" fill="#0a0a0a"/>

  <!-- headers -->
  <text x="160" y="26" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2" fill="#FF9900">DATA TAGGING</text>
  <text x="740" y="26" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2" fill="#D8D8D8">OPERATIONS</text>

  <!-- header icons -->
  <rect x="60" y="40" width="200" height="190" rx="28" fill="#FF9900"/>
  <path d="M120,100 L172,100 L205,135 L172,170 L120,170 Z" fill="#ffffff"/>
  <circle cx="138" cy="118" r="8" fill="#FF9900"/>

  <rect x="640" y="40" width="200" height="190" rx="28" fill="#AFAFAF"/>
  <circle cx="712" cy="108" r="22" fill="#ffffff"/>
  <path d="M672,182 Q672,140 712,140 Q752,140 752,182 Z" fill="#ffffff"/>
  <circle cx="768" cy="100" r="18" fill="#ffffff"/>
  <path d="M735,182 Q735,148 768,148 Q801,148 801,182 Z" fill="#ffffff"/>

  <!-- center dotted spine -->
  <line x1="450" y1="245" x2="450" y2="560" stroke="#3E9BE0" stroke-width="3" stroke-dasharray="2,8"/>

  <!-- row 1: configure audits (boxed) -->
  <rect x="40" y="260" width="340" height="70" rx="10" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="520" y="260" width="340" height="70" rx="10" fill="none" stroke="#CCCCCC" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M60,285 L72,285 M60,291 L80,291 M60,297 L76,297" stroke="#ffffff" stroke-width="2" fill="none"/>
  <path d="M540,285 L552,285 M540,291 L560,291 M540,297 L556,297" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="92" y="290" font-size="16" fill="#ffffff">Review team</text>
  <text x="92" y="310" font-size="16" fill="#ffffff">configures audits</text>
  <text x="572" y="290" font-size="16" fill="#ffffff">Review team</text>
  <text x="572" y="310" font-size="16" fill="#ffffff">configures audits</text>

  <!-- arrow row1 -> row2 -->
  <line x1="210" y1="330" x2="210" y2="368" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/>
  <line x1="690" y1="330" x2="690" y2="368" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/>

  <!-- row 2: complete audits / sees performance (no box) -->
  <circle cx="66" cy="392" r="10" fill="#ffffff"/>
  <path d="M50,412 Q66,398 82,412 Z" fill="#ffffff"/>
  <text x="92" y="388" font-size="16" fill="#ffffff">Annotators complete</text>
  <text x="92" y="408" font-size="16" fill="#ffffff">audits in their task queue</text>

  <rect x="546" y="384" width="26" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="552" y1="390" x2="564" y2="390" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="552" y1="396" x2="560" y2="396" stroke="#ffffff" stroke-width="1.5"/>
  <text x="592" y="388" font-size="16" fill="#ffffff">Review team sees</text>
  <text x="592" y="408" font-size="16" fill="#ffffff">annotator performance</text>

  <!-- horizontal connector row2 (pointing right) -->
  <line x1="392" y1="398" x2="428" y2="398" stroke="#8A8A8A" stroke-width="2"/>
  <line x1="472" y1="398" x2="518" y2="398" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arrowgray)"/>
  <circle cx="443" cy="398" r="11" fill="none" stroke="#3E9BE0" stroke-width="3"/>
  <circle cx="459" cy="398" r="11" fill="none" stroke="#3E9BE0" stroke-width="3"/>

  <!-- arrow row2 -> row3 -->
  <line x1="210" y1="420" x2="210" y2="458" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/>
  <line x1="690" y1="420" x2="690" y2="458" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/>

  <!-- row 3: see tasks in tagging site / tasks per annotator (no box) -->
  <path d="M56,474 L80,474 M56,480 L80,480 M56,486 L80,486" stroke="#ffffff" stroke-width="2"/>
  <circle cx="60" cy="474" r="1.6" fill="#ffffff"/>
  <text x="92" y="480" font-size="16" fill="#ffffff">Annotators &amp; Review team</text>
  <text x="92" y="500" font-size="16" fill="#ffffff">see tasks in the Tagging site</text>

  <rect x="546" y="472" width="30" height="20" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="546" y1="486" x2="576" y2="486" stroke="#ffffff" stroke-width="2"/>
  <line x1="561" y1="492" x2="561" y2="497" stroke="#ffffff" stroke-width="2"/>
  <text x="592" y="480" font-size="16" fill="#ffffff">Review team sees Tagging</text>
  <text x="592" y="500" font-size="16" fill="#ffffff">tasks per annotator</text>

  <!-- horizontal connector row3 (pointing left) -->
  <line x1="518" y1="488" x2="482" y2="488" stroke="#8A8A8A" stroke-width="2"/>
  <line x1="438" y1="488" x2="392" y2="488" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arrowgrayleft)"/>
  <circle cx="443" cy="488" r="11" fill="none" stroke="#3E9BE0" stroke-width="3"/>
  <circle cx="459" cy="488" r="11" fill="none" stroke="#3E9BE0" stroke-width="3"/>

  <!-- arrow row3 -> row4 -->
  <line x1="210" y1="510" x2="210" y2="548" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/>
  <line x1="690" y1="510" x2="690" y2="548" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,5" marker-end="url(#arrow)"/>

  <!-- row 4: see judgment (boxed) -->
  <rect x="40" y="560" width="340" height="60" rx="10" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="520" y="560" width="340" height="60" rx="10" fill="none" stroke="#CCCCCC" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M60,578 h20 v12 l-6,6 v-6 h-14 z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M540,578 h20 v12 l-6,6 v-6 h-14 z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="92" y="595" font-size="17" fill="#ffffff">See judgment</text>
  <text x="572" y="595" font-size="17" fill="#ffffff">See judgment</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A8A8A"/>
    </marker>
    <marker id="arrowgrayleft" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A8A8A"/>
    </marker>
  </defs>
</svg>
